<style>

<script>
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, ms) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2600); }
  // เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์แบบ Promise
  function api(fn) { var args = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok, no) { google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(e); })[fn].apply(null, args); }); }
  function fail(e) { toast('⚠️ ' + (e && e.message ? e.message : e), 4000); }
  // ---------- ตัวจับเวลาแต่ละขั้น (เวลาอ้างอิงจากเซิร์ฟเวอร์ ไม่ขึ้นกับนาฬิกาของเครื่อง) ----------
  var FF_T = null, FF_OFF = 0;
  function ffTimerSet(pub) { if (!pub || !pub.timer) return; FF_T = pub; FF_OFF = pub.timer.now - Date.now(); ffTimerTick(); }
  function ffMs(ms) { var s = Math.round(Math.abs(ms) / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function ffTimerCalc() {
    if (!FF_T) return null;
    var T = FF_T.timer, now = Date.now() + FF_OFF, planMin = Number(T.min[FF_T.phase]);
    var total = (T.log || []).reduce(function (a, x) { return a + ((x.e || now) - x.s); }, 0), planTotal = 0;
    for (var k in T.min) planTotal += Number(T.min[k]) || 0;
    var r = { total: total, budget: (T.budget || 55) * 60000, planTotal: planTotal, has: !!(planMin && T.start) };
    if (r.has) { r.plan = planMin * 60000; r.used = now - T.start; r.left = r.plan - r.used; }
    return r;
  }
  function ffTimerTick() {
    var t = ffTimerCalc(), els = $$('.fftimer'); if (!els.length) return;
    els.forEach(function (el) {
      var mode = el.dataset.mode;
      if (!t) { el.innerHTML = ''; return; }
      var cls = !t.has ? '' : t.left < 0 ? 'over' : t.left < 60000 ? 'soon' : 'ok';
      var tot = 'รวมทั้งคาบ ' + ffMs(t.total) + ' / ' + (t.budget / 60000) + ' นาที';
      if (mode === 'small') { el.className = 'fftimer ft-small ' + cls; el.innerHTML = t.has ? '⏱ ' + (t.left < 0 ? '+' + ffMs(t.left) + ' เกินเวลา' : ffMs(t.left)) : ''; return; }
      if (mode === 'total') { el.innerHTML = tot; return; }
      el.className = 'fftimer ft-big ' + cls;
      el.innerHTML = t.has ? '<div class="ft-main">⏱ ' + (t.left < 0 ? 'เกินเวลา +' + ffMs(t.left) : 'เหลือ ' + ffMs(t.left)) + ' <span class="ft-of">จาก ' + (t.plan / 60000) + ' นาที</span></div>' +
        '<div class="ft-bar"><div style="width:' + Math.min(100, Math.max(0, t.used / t.plan * 100)) + '%"></div></div><div class="ft-tot">' + tot + (t.total > t.budget ? ' · ⚠️ เกินกรอบ' : '') + '</div>'
        : '<div class="ft-tot">' + tot + '</div>';
    });
  }
  setInterval(ffTimerTick, 1000);
  var ROLE_IDX = { data: 1, random: 2, check: 3, end: 4 };
  var FLOW = ['📦 Global + On start: Load Array → Call "Random"', '🏁 Random: Array ยังไม่ว่าง? → 🎲 สุ่ม Num → แสดงโจทย์ → เก็บ Answer → Delete', '✔️ กดปุ่มตอบ: ถูก → +1 Score · ทั้งถูกและผิด → Call "Random" ↺', '🏁 Array ว่างแล้ว → Go to layout สรุปคะแนน (แสดง Score)'];
</script>

<body>
<header class="top"><h1>🏭 Function Factory · แผงครู</h1><span class="sub" id="sub"></span></header>
<main id="app"></main>
<script>
var S = null, T = null, PIN = null, busy = false, OPEN = {};
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
api('getStatic').then(function (s) { S = s; PIN = store('ff_pin'); if (PIN) api('teacherLogin', PIN).then(start).catch(login); else login(); }).catch(fail);
function login() {
  $('#app').innerHTML = '<div class="card" style="max-width:420px"><h2>🔒 PIN ครู</h2><input id="pin" type="password" inputmode="numeric"><div class="row" style="margin-top:10px"><button id="go">เข้าสู่แผงครู</button></div><p class="mute">PIN เริ่มต้นคือ 1234 · เปลี่ยนได้ในแผงครู หัวข้อ “หลักฐานและการจัดการข้อมูล”</p></div>';
  $('#go').onclick = function () { var p = $('#pin').value; api('teacherLogin', p).then(function () { PIN = p; store('ff_pin', p); start(); }).catch(fail); };
}
var timer;
function start() { poll(); }
function poll() { clearTimeout(timer); api('getTeacherState', PIN).then(function (t) { T = t; ffTimerSet(t.pub); var a = document.activeElement; if (!busy && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) draw(); }).catch(fail).then(function () { (clearTimeout(timer), timer = setTimeout(poll, 15000)); }); }
function act(action, data, msg) { busy = true; return api('teacherAction', PIN, action, data || {}).then(function (r) { if (msg) toast(msg); busy = false; poll(); return r; }).catch(function (e) { busy = false; fail(e); }); }
var ROLE = {};
function roleName(id) { var r = S.roles.filter(function (x) { return x.id === id; })[0]; return r ? r.ic + ' ' + r.name : ''; }
function sel(val, opts, attrs) { return '<select ' + attrs + '><option value=""></option>' + opts.map(function (o) { return '<option' + (String(val) === String(o) ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>'; }
function ck5(marks, attr, no) { var m = String(marks || ''); return '<div style="white-space:nowrap">' + [0, 1, 2, 3, 4].map(function (i) { return '<label style="font-size:12px"><input type="checkbox" style="width:18px;height:18px;padding:0;vertical-align:middle" ' + attr + '="' + no + '" data-i="' + i + '"' + (m[i] === '1' ? ' checked' : '') + '>' + (i + 1) + '</label>'; }).join(' ') + '</div>'; }
function sum(a) { var v = a.filter(function (x) { return x !== '' && x !== undefined && x !== null; }); return v.length ? v.reduce(function (x, y) { return x + Number(y); }, 0) : ''; }

// ตัวจับเวลา: นับถอยหลังขั้นปัจจุบัน · +1 นาที · ตั้งเวลาแต่ละขั้น · เวลาที่ใช้จริงเทียบแผน
function timerPanel(P) {
  var Tm = P.timer; if (!Tm) return '';
  var used = {}, now = Date.now() + FF_OFF, planTotal = 0;
  (Tm.log || []).forEach(function (x) { used[x.p] = (used[x.p] || 0) + ((x.e || now) - x.s); });
  var rows = S.phases.filter(function (p) { return Tm.min[p.id] !== undefined; }).map(function (p) {
    var plan = Number(Tm.min[p.id]) || 0, u = used[p.id]; planTotal += plan;
    var diff = u ? Math.round((u / 60000 - plan) * 10) / 10 : '';
    return '<tr' + (p.id === P.phase ? ' style="background:#e8f1ff"' : '') + '><td class="l">' + esc(p.label) + '</td><td><input type="number" min="0" max="60" step="1" data-pm="' + p.id + '" value="' + plan + '"></td><td>' + (u ? ffMs(u) : '') + '</td><td style="color:' + (diff > 0 ? 'var(--bad)' : 'var(--ok)') + '">' + (diff === '' ? '' : (diff > 0 ? '+' : '') + diff) + '</td></tr>';
  }).join('');
  return '<div class="row" style="margin-top:10px;align-items:flex-start"><div class="fftimer" data-mode="big" style="flex:1;min-width:280px"></div>' +
    (Tm.min[P.phase] ? '<button class="ghost" id="plus1">+1 นาที ให้ขั้นนี้</button>' : '') + '</div>' +
    '<details style="margin-top:8px"><summary>⏱ ตั้งเวลาแต่ละขั้น · เวลาที่ใช้จริง (แผนรวม ' + planTotal + ' นาที จากกรอบ ' + Tm.budget + ' นาที' + (planTotal > Tm.budget ? ' ⚠️ เกินกรอบ' : '') + ')</summary>' +
    '<table class="t" style="margin-top:8px;max-width:640px"><tr><th>ขั้น</th><th>แผน (นาที)</th><th>ใช้จริง</th><th>ต่าง (นาที)</th></tr>' + rows + '</table>' +
    '<div class="row" style="margin-top:8px"><button id="pmsave">บันทึกเวลาแผน</button><button class="warn" id="treset">เริ่มจับเวลาใหม่ทั้งคาบ</button><span class="mute">การจับเวลาเริ่มเองเมื่อกดเปลี่ยนขั้น</span></div></details>';
}
function draw() {
  var P = T.pub, url = FF_BASE;
  $('#sub').textContent = 'ขั้นปัจจุบัน: ' + ((S.phases.filter(function (x) { return x.id === P.phase; })[0] || {}).label || '');
  var h = '<div class="card"><h2>▶️ ขั้นตอนการสอน</h2><div class="phases">' + S.phases.map(function (p) { var mn = P.timer && P.timer.min[p.id]; return '<button class="' + (p.id === P.phase ? 'cur' : '') + '" data-ph="' + p.id + '">' + esc(p.label) + (mn ? ' · ' + mn + '′' : '') + '</button>'; }).join('') + '</div>' +
    timerPanel(P) +
    '<div class="row mute" style="margin-top:8px">ลิงก์จอใหญ่: <a href="' + url + 'screen.html" target="_blank">' + url + 'screen.html</a> · ลิงก์นักเรียน: <a href="' + url + '" target="_blank">' + url + '</a></div></div>';

  // แผงตามขั้น
  if (P.phase === 'cloud') {
    h += '<div class="card"><h2>☁️ Word Cloud · แตะคำเพื่อเปลี่ยนกลุ่มสี</h2><p class="mute">แตะวนสี: เทา → 📦 → 🎲 → ✔️ → 🏁 → ➕ ส่วนเสริม · ปุ่ม ✕ ซ่อนคำไม่เหมาะสม · ส่งแล้ว ' + P.cloudSenders + ' คน</p><div>' +
      P.cloud.map(function (w) { var c = S.cats[w.cat] || S.cats[0]; return '<span style="white-space:nowrap"><button class="w" style="background:' + c.color + '" data-tag="' + esc(w.w) + '" data-cat="' + w.cat + '">' + esc(w.w) + ' ×' + w.n + '</button><button class="ghost" style="min-height:0;padding:2px 8px" data-hide="' + esc(w.w) + '">✕</button></span>'; }).join('') +
      '</div><div class="row" style="margin-top:10px"><button class="' + (P.reveal ? 'ghost' : 'ok') + '" id="reveal">' + (P.reveal ? 'ซ่อนชื่อชิ้นส่วน' : '🎉 เปิดชื่อชิ้นส่วน 📦 🎲 ✔️ 🏁') + '</button></div></div>';
  }
  // ติดธงจากแบบทดสอบก่อนเรียน → การ์ดทบทวน (ขั้นที่ 1.1 → 2.3)
  var flagged = T.people.filter(function (p) { return p.flag.length; });
  var flagOpen = ['pretest', 'cloud', 'parsons', 'handoff'].indexOf(P.phase) >= 0;
  h += '<div class="card"><details' + (flagOpen ? ' open' : '') + '><summary>🚩 ติดธงจากแบบทดสอบก่อนเรียน (ตอบผิดข้อ ' + S.flagItems.map(function (i) { return i + 1; }).join(', ') + ') · ' + flagged.length + ' คน · ตั้งเป้าหมายแล้ว ' + P.goalsDone + ' คน</summary>' +
    (flagged.length ? '<p class="mute">แจกการ์ดทบทวน (สื่อ5) ตามเลขการ์ด แล้วให้เพื่อนคู่ (บทบาทเดียวกัน ไม่ติดธง) อธิบาย 1 นาทีในขั้นที่ 2.3 · ผู้ติดธงจะเห็นการ์ดดิจิทัลบน iPad ก่อนเริ่ม Parsons</p><div class="scroll"><table class="t"><tr><th>ที่</th><th>ชื่อ</th><th>บทบาท</th><th>Pre</th><th>ข้อที่ผิด</th><th>การ์ดที่ใช้</th><th>เพื่อนคู่ที่แนะนำ</th><th>ทบทวนบน iPad</th><th>แจกการ์ดแล้ว</th></tr>' +
      flagged.map(function (p) {
        var cards = S.cards.filter(function (c) { return c.items.some(function (i) { return p.flag.indexOf(i + 1) >= 0; }); }).map(function (c) { return c.ic + c.id; }).join(' ');
        var sp = p.support || {};
        return '<tr><td>' + p.no + '</td><td class="l">' + esc(p.name) + '</td><td>' + (roleName(p.role).split(' ')[0] || '–') + '</td><td>' + p.pre + '</td><td>' + p.flag.join(', ') + '</td><td>' + cards + '</td><td class="l">' + esc(p.buddy || (p.role ? 'ไม่มีคู่ว่างในบทบาทนี้ ครูจับคู่เอง' : 'รอเลือกบทบาท')) + '</td><td>' + (sp.done ? '✅ ' + sp.score + '/' + sp.total : '') + '</td><td><input type="checkbox" style="width:24px;height:24px" data-cg="' + p.no + '"' + (sp.given ? ' checked' : '') + '></td></tr>';
      }).join('') + '</table></div>' : '<p class="mute">ยังไม่มีผู้ถูกติดธง (หรือยังไม่มีใครส่งแบบทดสอบก่อนเรียน)</p>') + '</details></div>';
  if (P.phase === 'rules' || P.phase === 'build' || P.golden) {
    var g = P.golden || S.roles.map(function (r) { var mine = P.rules.filter(function (x) { return x.role === r.id; }); return mine.length ? mine[0].text : r.rule; });
    h += '<div class="card"><h2>🏆 กฎทอง</h2>' + S.roles.map(function (r, i) {
      var sub = P.rules.filter(function (x) { return x.role === r.id; });
      return '<div style="margin:8px 0"><b>' + r.ic + ' ' + r.name + '</b>' + sub.map(function (x) { return '<div class="mute">ทีม ' + x.team + ': ' + esc(x.text) + ' <button class="ghost" style="min-height:0;padding:2px 8px" data-use="' + i + '" data-text="' + esc(x.text) + '">ใช้ข้อนี้</button></div>'; }).join('') +
        '<textarea data-gold="' + i + '" style="min-height:44px">' + esc(g[i]) + '</textarea><div class="mute">กฎทองที่ต้องได้: ' + esc(r.rule) + ' <button class="ghost" style="min-height:0;padding:2px 8px" data-use="' + i + '" data-text="' + esc(r.rule) + '">ใช้ข้อความนี้</button></div></div>';
    }).join('') + '<button class="ok" id="gold">✅ ยืนยันกฎทอง (ขึ้นจอใหญ่)</button></div>';

var RESETS = [['แบบทดสอบ + เป้าหมาย + การ์ดทบทวน', ['Tests', 'Goals', 'Support']], ['Word Cloud', ['Cloud', 'CloudTag']], ['Parsons + บัตรส่งต่องาน + กฎทอง', ['Parsons', 'Handoff', 'Rules']], ['ประกอบเกม + บั๊ก + ภารกิจต่อยอด', ['Build', 'Bugs', 'Extend']], ['ประเมินเพื่อน + สะท้อนตนเอง + ภารกิจค้นคว้า', ['Peer', 'Reflect', 'Inquiry']], ['Rubric ทั้งหมด', ['Rubric', 'GroupRubric']], ['กลุ่ม/บทบาทนักเรียน', ['Students']],
  ['ทั้งหมด + กลับไปขั้นเริ่มต้น', ['Tests', 'Goals', 'Support', 'Cloud', 'CloudTag', 'Parsons', 'Handoff', 'Rules', 'Build', 'Bugs', 'Extend', 'Peer', 'Reflect', 'Inquiry', 'Rubric', 'GroupRubric', 'Students', 'Config']]];
function bind() {
  if ($('#plus1')) $('#plus1').onclick = function () { var m = {}; for (var k in T.pub.timer.min) m[k] = Number(T.pub.timer.min[k]); m[T.pub.phase] = (m[T.pub.phase] || 0) + 1; act('phaseMin', { min: m }, 'เพิ่มเวลา 1 นาทีแล้ว'); };
  if ($('#pmsave')) $('#pmsave').onclick = function () { var m = {}; $$('[data-pm]').forEach(function (i) { m[i.dataset.pm] = Math.max(0, Number(i.value) || 0); }); act('phaseMin', { min: m }, 'บันทึกเวลาแผนแล้ว'); };
  if ($('#treset')) $('#treset').onclick = function () { if (confirm('ล้างเวลาที่บันทึกไว้ แล้วเริ่มจับเวลาใหม่ตั้งแต่ขั้นปัจจุบัน?')) act('timerReset', {}, 'เริ่มจับเวลาใหม่แล้ว'); };
  $$('[data-ph]').forEach(function (b) { b.onclick = function () { act('phase', { phase: b.dataset.ph }, 'เปลี่ยนขั้นแล้ว'); }; });
  $$('[data-tag]').forEach(function (b) { b.onclick = function () { var c = (Number(b.dataset.cat) + 1) % S.cats.length; b.style.background = S.cats[c].color; b.dataset.cat = c; act('tag', { norm: b.dataset.tag, cat: c }); }; });
  $$('[data-hide]').forEach(function (b) { b.onclick = function () { if (confirm('ซ่อนคำ “' + b.dataset.hide + '” จากจอใหญ่?')) act('hideWord', { norm: b.dataset.hide }); }; });
  if ($('#reveal')) $('#reveal').onclick = function () { act('reveal', { on: !T.pub.reveal }); };
  $$('[data-use]').forEach(function (b) { b.onclick = function () { $('[data-gold="' + b.dataset.use + '"]').value = b.dataset.text; }; });
  if ($('#gold')) $('#gold').onclick = function () { act('golden', { rules: $$('[data-gold]').map(function (t) { return t.value.trim(); }) }, 'ยืนยันกฎทองแล้ว'); };
  $$('[data-sos]').forEach(function (b) { b.onclick = function () { act('resolveSos', { group: b.dataset.sos }); }; });
  $$('[data-gr]').forEach(function (s) { s.onchange = function () { act('groupRubric', { group: s.dataset.gr, key: s.dataset.k, value: s.value }); }; });
  $$('[data-rb]').forEach(function (s) { s.onchange = function () { act('rubric', { no: s.dataset.rb, key: s.dataset.k, value: s.value }); }; });
  if ($('#pwS')) { $('#pwS').onclick = printStudents; $('#pwG').onclick = printGroups; $('#pwF').onclick = printForms; }
  [['data-pk', 'pk', 'pieceMarks'], ['data-hk', 'hk', 'handoffMarks']].forEach(function (z) { $$('[' + z[0] + ']').forEach(function (c) { c.onchange = function () { var no = c.dataset[z[1]]; var m = [0, 1, 2, 3, 4].map(function (i) { var x = $('[' + z[0] + '="' + no + '"][data-i="' + i + '"]'); return x && x.checked ? '1' : '0'; }).join(''); act(z[2], { no: no, marks: m }); }; }); });
  $$('[data-sg]').forEach(function (s) { s.onchange = function () { var p = T.people.filter(function (x) { return x.no == s.dataset.sg; })[0]; act('setStudent', { no: s.dataset.sg, group: s.value, role: p.role }); }; });
  $$('[data-sr]').forEach(function (s) { s.onchange = function () { var p = T.people.filter(function (x) { return x.no == s.dataset.sr; })[0]; act('setStudent', { no: s.dataset.sr, group: p.group, role: s.value }); }; });
  $$('[data-rt]').forEach(function (b) { b.onclick = function () { if (confirm('ให้เลขที่ ' + b.dataset.rt + ' ทำแบบทดสอบ' + (b.dataset.kind === 'pre' ? 'ก่อน' : 'หลัง') + 'เรียนใหม่?')) act('resetTest', { no: b.dataset.rt, kind: b.dataset.kind }); }; });
  $$('[data-reset]').forEach(function (b) { b.onclick = function () { if (confirm('ล้างข้อมูล “' + b.textContent + '” ? ลบแล้วกู้คืนไม่ได้')) act('resetPart', { sheets: RESETS[Number(b.dataset.reset)][1] }, 'ล้างแล้ว'); }; });
  $$('[data-cg]').forEach(function (c) { c.onchange = function () { act('cardGiven', { no: c.dataset.cg, on: c.checked }, c.checked ? 'บันทึกว่าแจกการ์ดแล้ว' : 'ยกเลิกแล้ว'); }; });
  $('#ev').onclick = function () { busy = true; toast('กำลังสร้างไฟล์ Excel…'); ffExportExcel(PIN).then(function (n) { busy = false; $('#evlink').textContent = '✅ ดาวน์โหลดแล้ว: ' + n; }).catch(function (e) { busy = false; fail(e); }); };
  $('#pinsave').onclick = function () { var v = $('#newpin').value.trim(); if (v.length < 4) return toast('PIN อย่างน้อย 4 ตัว'); busy = true; api('teacherAction', PIN, 'pin', { pin: v }).then(function () { PIN = v; store('ff_pin', v); busy = false; toast('เปลี่ยน PIN แล้ว'); poll(); }).catch(function (e) { busy = false; fail(e); }); };
  $('#rsave').onclick = function () { if (confirm('แทนที่รายชื่อทั้งหมด?')) act('roster', { text: $('#ros').value }, 'บันทึกรายชื่อแล้ว').then(function () { api('getStatic').then(function (s) { S = s; }); }); };
}

ffLive(function () { if (PIN && T) poll(); });
</script>
</body></html>
